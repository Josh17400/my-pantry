# Supabase CLI config for The Good Pantry.
# See README.md for apply commands. Do not put credentials here.
#
# NOTE: the project ref is a top-level `project_id`, not a [project] table —
# the CLI rejects the latter with "'config.config' has invalid keys: project".
project_id = "nolwohnxwtckfgzrrpbw"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
schema_paths = []

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
